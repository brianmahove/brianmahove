<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840" role="img" aria-labelledby="t d">
  <title id="t">Brian Mahove - receipt of systems built</title>
  <desc id="d">An animated thermal receipt printing out of a POS printer, listing Tylliq POS, a company management system, an airtime top-up platform, a multi-branch POS, a butchery cloud POS and a fleet rental platform.</desc>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1c2430"/></pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%"><stop offset="0" stop-color="#00FFB3" stop-opacity="0.16"/><stop offset="1" stop-color="#00FFB3" stop-opacity="0"/></radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3340"/><stop offset="1" stop-color="#181e27"/></linearGradient>
    <clipPath id="below"><rect class="reveal" x="0" y="97" width="900" height="840"/></clipPath>
    <filter id="ds" x="-10%" y="-5%" width="120%" height="115%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    
  .reveal { transform-origin: 0px 97px; animation: print 18s infinite; }
  @keyframes print {
    0%   { transform: scaleY(0); opacity: 1; animation-timing-function: steps(46, end); }
    40%  { transform: scaleY(1); opacity: 1; animation-timing-function: linear; }
    92%  { transform: scaleY(1); opacity: 1; animation-timing-function: ease-in; }
    97%  { transform: scaleY(1); opacity: 0; }
    100% { transform: scaleY(0); opacity: 0; }
  }
  .led { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .chip { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @media (prefers-reduced-motion: reduce) { .reveal, .led, .chip { animation: none; } }

  </style>

  <rect width="900" height="840" rx="18" fill="#0D1117"/>
  <rect width="900" height="840" rx="18" fill="url(#dots)"/>
  <ellipse cx="450.0" cy="378" rx="430" ry="420" fill="url(#glow)"/>

  <g class="chip" style="animation-delay:0.0s"><rect x="24" y="190" width="150" height="38" rx="19" fill="#00FFB3" fill-opacity="0.07" stroke="#00FFB3" stroke-opacity="0.45"/><text x="99" y="214.5" text-anchor="middle" font-size="14" fill="#00FFB3">Flutter</text></g>
<g class="chip" style="animation-delay:-1.3s"><rect x="24" y="300" width="150" height="38" rx="19" fill="#00FFB3" fill-opacity="0.07" stroke="#00FFB3" stroke-opacity="0.45"/><text x="99" y="324.5" text-anchor="middle" font-size="14" fill="#00FFB3">Dart</text></g>
