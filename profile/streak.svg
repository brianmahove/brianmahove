<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="t d">
  <title id="t">GitHub contribution streak</title>
  <desc id="d">140 contributions in the last year. Current streak 0 days. Longest streak 3 days.</desc>
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .ring { stroke-dasharray: 251; stroke-dashoffset: 251; animation: draw 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .flame { animation: flick 1.6s ease-in-out infinite; transform-origin: 247px 34px; }
    @keyframes flick { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; stroke-dashoffset: 0; } .flame { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194" rx="10" fill="#0D1117" stroke="#26313f"/>
  <line x1="165" y1="30" x2="165" y2="165" stroke="#26313f"/>
  <line x1="330" y1="30" x2="330" y2="165" stroke="#26313f"/>

  <text x="82" y="88" text-anchor="middle" font-size="34" font-weight="800" fill="#e6edf3">140</text>
  <text x="82" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#00FFB3">Contributions</text>
  <text x="82" y="134" text-anchor="middle" font-size="11" fill="#8b98a9">Sep 21, 2025 - Sep 24, 2026</text>

  <circle cx="247" cy="94" r="40" fill="none" stroke="#1f2a37" stroke-width="5"/>
  <circle class="ring" style="display:none" cx="247" cy="94" r="40" fill="none" stroke="#00FFB3" stroke-width="5" stroke-linecap="round" transform="rotate(-90 247 94)"/>
  <path class="flame" d="M247,20 C251,27 258,30 258,39 A11,11 0 0 1 236,39 C236,34 239,32 240,28 C242,31 244,31 245,29 C246,26 246,23 247,20 Z" fill="#00FFB3"/>
  <text x="247" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#e6edf3">0</text>
  <text x="247" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#00FFB3">Current Streak</text>
  <text x="247" y="177" text-anchor="middle" font-size="11" fill="#8b98a9">no active streak</text>

  <text x="412" y="88" text-anchor="middle" font-size="34" font-weight="800" fill="#e6edf3">3</text>
  <text x="412" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#00FFB3">Longest Streak</text>
  <text x="412" y="134" text-anchor="middle" font-size="11" fill="#8b98a9">Oct 4 - Oct 6, 2025</text>
</svg>
