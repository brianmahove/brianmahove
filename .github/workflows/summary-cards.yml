name: Profile summary cards

# Needs a personal access token stored as the SUMMARY_GITHUB_TOKEN secret.
# Without it the job skips itself, so it never shows a red failure.
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 06:00 Harare time
  workflow_dispatch:

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        if: env.HAS_TOKEN == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 2
          AUTO_PUSH: true
          THEME: "github_dark"
